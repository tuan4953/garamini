<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sổ Bảo Hành Của Tôi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-4">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Sổ Bảo Hành Xe Của Tôi</h2>
        <a th:href="@{/customer/my-vehicles}" class="btn btn-outline-secondary">Quản lý xe</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-bold">Danh Sách Hạng Mục Được Bảo Hành</div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã Thẻ</th>
                    <th>Biển Số Xe</th>
                    <th>Hạng Mục / Phụ Tùng</th>
                    <th>Ngày Bắt Đầu</th>
                    <th>Thời Hạn Hết Hạn</th>
                    <th>Trạng Thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(warranties)}">
                    <td colspan="6" class="text-center py-4 text-muted">Bạn chưa có dữ liệu bảo hành nào.</td>
                </tr>
                <tr th:each="w : ${warranties}">
                    <td th:text="'#BH-' + ${w.id}">#BH-1</td>
                    <td class="fw-bold" th:text="${w.licensePlate}">29A-12345</td>
                    <td th:text="${w.itemOrService}">Thay Nhớt Kèm Lọc Nhớt</td>
                    <td th:text="${w.startDate}">2026-01-01</td>
                    <td th:text="${w.expiryDate}">2027-01-01</td>
                    <td>
                        <span class="badge bg-success" th:if="${w.active}">Còn Hiệu Lực</span>
                        <span class="badge bg-secondary" th:unless="${w.active}">Đã Hết Hạn</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
