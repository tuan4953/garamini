<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóa Đơn Của Tôi - Garage Auto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container my-5">
    <h3 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Hóa Đơn & Thanh Toán</h3>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Mã Hóa Đơn</th>
                        <th>Ngày Lập</th>
                        <th>Nội Dung Dịch Vụ</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th class="text-end pe-3">Xem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${invoices}" th:if="${invoices != null and !#lists.isEmpty(invoices)}">
                        <td class="ps-3 fw-bold text-primary" th:text="${'#INV-' + (inv?.id ?: '000')}">#INV-2026</td>
                        <td th:text="${inv?.createdAt != null ? #temporals.format(inv.createdAt, 'dd/MM/yyyy') : 'N/A'}">20/10/2026</td>
                        <td th:text="${inv?.description ?: 'Sửa chữa & Thay phụ tùng'}">Bảo dưỡng & Thay dầu</td>
                        <td class="fw-bold text-danger"
                            th:text="${inv?.totalAmount != null ? #numbers.formatDecimal(inv.totalAmount, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : '0 VNĐ'}">
                            1,500,000 VNĐ
                        </td>
                        <td>
                            <span th:if="${inv?.status?.name() == 'PAID' or inv?.status == 'PAID'}" class="badge bg-success">Đã thanh toán</span>
                            <span th:if="${inv?.status?.name() == 'UNPAID' or inv?.status == 'UNPAID'}" class="badge bg-warning text-dark">Chờ thanh toán</span>
                        </td>
                        <td class="text-end pe-3">
                            <a th:href="@{/customer/invoices/{id}(id=${inv?.id})}" class="btn btn-outline-primary btn-sm">
                                <i class="fa-solid fa-eye me-1"></i> Chi tiết
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${invoices == null or #lists.isEmpty(invoices)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-file-circle-xmark fa-2x mb-2 d-block"></i>
                            Bạn chưa có hóa đơn thanh toán nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
