<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Trang Cá Nhân Khách Hàng - Gara Motorbike</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container py-4">
  <h3 class="fw-bold text-dark mb-4"><i class="fas fa-user-circle text-primary me-2"></i>Bảng Điều Khiển Khách Hàng</h3>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-3 bg-white">
        <small class="text-muted">Lịch đặt sắp tới</small>
        <h3 class="fw-bold text-primary mb-0" th:text="${stats.activeAppointments}">1</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-3 bg-white">
        <small class="text-muted">Tổng chi tiêu dịch vụ</small>
        <h3 class="fw-bold text-success mb-0" th:text="${#numbers.formatDecimal(stats.totalSpent, 0, 'COMMA', 0, 'POINT')} + ' đ'">3,500,000 đ</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-3 bg-white">
        <small class="text-muted">Mã ưu đãi có thể dùng</small>
        <h3 class="fw-bold text-danger mb-0" th:text="${stats.availableVouchers}">3</h3>
        <a th:href="@{/promotions}" class="small text-decoration-none mt-2 d-block">Xem khuyến mãi →</a>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
