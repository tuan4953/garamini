<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Sửa Chữa & Bảo Dưỡng - Garage Auto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container my-5" style="max-width: 650px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0 text-primary">
            <i class="fa-solid fa-wrench me-2"></i> Đặt Lịch Sửa Chữa & Bảo Dưỡng
        </h3>
        <a th:href="@{/customer/appointments}" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-arrow-left me-1"></i> Lịch hẹn của tôi
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">

            <form th:action="@{/customer/appointments/create}" th:object="${appointmentRequest}" method="post">

                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <ul class="mb-0 ps-3">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                    </ul>
                </div>

                <!-- Chọn phương tiện -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Phương tiện cần kiểm tra / sửa chữa (*)</label>
                    <select th:field="*{vehicleId}" class="form-select" required>
                        <option value="">-- Chọn xe của bạn --</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v?.id}"
                                th:text="${(v?.licensePlate ?: 'Chưa biển') + ' - ' + (v?.brand ?: '') + ' ' + (v?.model ?: '')}">
                        </option>
                    </select>
                </div>

                <!-- Thời gian hẹn -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Thời gian mang xe đến garage (*)</label>
                    <input type="datetime-local" th:field="*{appointmentDate}" class="form-control" required>
                    <div class="form-text text-muted">Vui lòng chọn thời gian làm việc (từ 8:00 - 17:00).</div>
                </div>

                <!-- Mô tả sự cố sửa chữa -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Mô tả tình trạng hỏng hóc / Yêu cầu sửa chữa</label>
                    <textarea th:field="*{notes}" class="form-control" rows="4" placeholder="Mô tả chi tiết các dấu hiệu bất thường (VD: Tiếng kêu lạ ở động cơ, hệ thống phanh kém nhạy, thay dầu máy định kỳ...)"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">
                        <i class="fa-solid fa-calendar-check me-2"></i> Xác Nhận Đặt Lịch Sửa Chữa
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
