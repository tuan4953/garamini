<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Công Việc Được Phân Công</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-tools"></i> Danh Sách Công Việc Của Tôi</h2>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
    </div>

    <div th:replace="~{fragments/alert :: alert}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã Đơn</th>
                    <th>Biển Số Xe</th>
                    <th>Mẫu Xe</th>
                    <th>Khách Hàng</th>
                    <th>SĐT</th>
                    <th>Ngày Tiếp Nhận</th>
                    <th>Trạng Thái</th>
                    <th>Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${'#RO-' + job.orderId}" class="fw-bold">#RO-1</td>
                    <td><span class="badge bg-secondary" th:text="${job.licensePlate}">29A-12345</span></td>
                    <td th:text="${job.vehicleModel}">Honda Wave</td>
                    <td th:text="${job.customerName}">Nguyễn Văn A</td>
                    <td th:text="${job.customerPhone}">0987654321</td>
                    <td th:text="${#temporals.format(job.createdAt, 'dd/MM/yyyy HH:mm')}">29/08/2026</td>
                    <td>
                        <span class="badge bg-warning text-dark" th:if="${job.status == 'CREATED'}">Chờ xử lý</span>
                        <span class="badge bg-info text-white" th:if="${job.status == 'IN_PROGRESS'}">Đang sửa chữa</span>
                        <span class="badge bg-success" th:if="${job.status == 'COMPLETED'}">Hoàn thành</span>
                        <span class="badge bg-secondary" th:if="${job.status != 'CREATED' && job.status != 'IN_PROGRESS' && job.status != 'COMPLETED'}" th:text="${job.status}">Khác</span>
                    </td>
                    <td>
                        <a th:href="@{/technician/jobs/{id}(id=${job.orderId})}" class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil-square"></i> Cập nhật
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(jobs)}">
                    <td colspan="8" class="text-center py-4 text-muted">Bạn chưa được phân công công việc nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
