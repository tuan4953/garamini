<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Tiến Độ Công Việc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<div class="container py-4" style="max-width: 650px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-speedometer2"></i> Tiến Độ Sửa Chữa</h2>
        <a th:href="@{/technician/assigned-jobs}" class="btn btn-outline-secondary btn-sm">&larr; Quay lại</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/technician/progress-update}" th:object="${progressRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Mã / ID Xe (*)</label>
                    <input type="number" th:field="*{vehicleId}" class="form-control" placeholder="Nhập ID Xe" required>
                </div>

                <!-- Thanh Tiến Độ (Progress Bar Dynamic) -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <label class="form-label fw-bold mb-0">Tiến độ hoàn thành:</label>
                        <span id="progressText" class="fw-bold text-primary fs-5">50%</span>
                    </div>

                    <div class="progress mb-3" style="height: 25px;">
                        <div id="progressBar"
                             class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                             role="progressbar"
                             style="width: 50%; font-weight: bold;"
                             aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                            50%
                        </div>
                    </div>

                    <!-- Thanh trượt điều chỉnh % -->
                    <input type="range"
                           th:field="*{progress}"
                           class="form-range"
                           min="0" max="100" step="5"
                           id="progressRange"
                           oninput="updateProgressBar(this.value)">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Ghi chú công việc đã làm</label>
                    <textarea th:field="*{diagnosticResult}" class="form-control" rows="3" placeholder="Ví dụ: Đã tháo động cơ, đang tiến hành thay xécmăng..."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-cloud-upload"></i> Cập Nhật Tiến Độ
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function updateProgressBar(value) {
        const bar = document.getElementById('progressBar');
        const text = document.getElementById('progressText');

        bar.style.width = value + '%';
        bar.textContent = value + '%';
        bar.setAttribute('aria-valuenow', value);
        text.textContent = value + '%';

        // Đổi màu thanh tiến độ dựa trên %
        if (value < 30) {
            bar.className = 'progress-bar progress-bar-striped progress-bar-animated bg-danger';
        } else if (value < 70) {
            bar.className = 'progress-bar progress-bar-striped progress-bar-animated bg-warning text-dark';
        } else {
            bar.className = 'progress-bar progress-bar-striped progress-bar-animated bg-success';
        }
    }

    // Khởi tạo trạng thái ban đầu khi tải trang
    document.addEventListener("DOMContentLoaded", function() {
        const range = document.getElementById('progressRange');
        if (range) updateProgressBar(range.value);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
