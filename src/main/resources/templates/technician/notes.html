<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ghi Chú Kỹ Thuật</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-4" style="max-width: 650px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-journal-text"></i> Ghi Chú & Báo Cáo KTV</h2>
        <a th:href="@{/technician/assigned-jobs}" class="btn btn-outline-secondary btn-sm">&larr; Quay lại</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/technician/notes}" th:object="${noteRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Mã / ID Đơn Công Việc (*)</label>
                    <input type="number" th:field="*{vehicleId}" class="form-control" placeholder="Nhập ID đơn sửa chữa" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nội dung ghi chú / Tình trạng phát sinh</label>
                    <textarea th:field="*{initialCondition}" class="form-control" rows="3" placeholder="Nhập chi tiết các vấn đề phát sinh trong quá trình làm..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Đề xuất / Hướng xử lý</label>
                    <textarea th:field="*{diagnosticResult}" class="form-control" rows="3" placeholder="Ghi chú phương án khắc phục hoặc tư vấn thêm cho khách..."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-warning text-dark fw-bold">
                        <i class="bi bi-send-check"></i> Cập Nhật Ghi Chú
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
