<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chẩn Đoán & Đề Xuất Sửa Chữa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-stethoscope"></i> Phiếu Chẩn Đoán & Đề Xuất</h2>
        <a th:href="@{/technician/assigned-jobs}" class="btn btn-outline-secondary btn-sm">&larr; Quay lại</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/technician/diagnosis}" th:object="${diagnosisRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Mã / ID Đơn Sửa Chữa (*)</label>
                    <input type="number" th:field="*{repairOrderId}" class="form-control" placeholder="Nhập ID đơn sửa chữa" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Kết quả chẩn đoán hỏng hóc</label>
                    <textarea th:field="*{diagnosticResult}" class="form-control" rows="3" placeholder="Chi tiết các lỗi kỹ thuật phát hiện được..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Ghi chú của KTV</label>
                    <textarea th:field="*{technicianNote}" class="form-control" rows="2" placeholder="Ghi chú thêm cho cố vấn dịch vụ / khách hàng..."></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-check2-circle"></i> Hoàn Tất Chẩn Đoán
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
