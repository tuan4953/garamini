<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tiếp Nhận & Kiểm Tra Xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-4" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-clipboard-check"></i> Phiếu Tiếp Nhận & Kiểm Tra Xe</h2>
        <a th:href="@{/technician/assigned-jobs}" class="btn btn-outline-secondary btn-sm">&larr; Quay lại</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/technician/intake}" th:object="${inspectionRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Mã / ID Xe (*)</label>
                    <input type="number" th:field="*{vehicleId}" class="form-control" placeholder="Nhập ID Xe" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Mã / ID KTV (Tùy chọn)</label>
                    <input type="number" th:field="*{technicianId}" class="form-control" placeholder="Nhập ID KTV tiếp nhận">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Tình trạng xe ban đầu</label>
                    <textarea th:field="*{initialCondition}" class="form-control" rows="3" placeholder="Mô tả hiện trạng xe khi khách giao..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Kết quả chẩn đoán / Kiểm tra</label>
                    <textarea th:field="*{diagnosticResult}" class="form-control" rows="3" placeholder="Nhập chẩn đoán hỏng hóc sơ bộ..."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-save"></i> Lưu Phiếu Kiểm Tra
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
