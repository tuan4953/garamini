<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Đặt lại mật khẩu</title>

</head>

<body>

<h1>Đặt lại mật khẩu</h1>

<form>

    <div>

        <label>Mật khẩu mới</label>

        <input type="password"
               name="password">

    </div>

    <div>

        <label>Xác nhận mật khẩu</label>

        <input type="password"
               name="confirmPassword">

    </div>

    <button type="submit">
        Đặt lại mật khẩu
    </button>

</form>

</body>

</html>
