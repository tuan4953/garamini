<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - T-RIDE Garage</title>

    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1e1b4b, transparent 40%),
            radial-gradient(circle at bottom right, #0f172a, transparent 40%),
            linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng đốm sáng nền động */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(37, 99, 235, 0.15);
            filter: blur(90px);
            border-radius: 50%;
            top: 20%;
            left: 20%;
            animation: float 8s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 40px); }
        }

        /* Container đăng nhập */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header Logo & Tiêu đề */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .brand-logo i {
            color: var(--primary-color);
        }

        .brand-logo span.accent {
            color: var(--primary-color);
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Thẻ thông báo (Alerts) */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 14.5px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-input:focus + .input-icon,
        .form-input:focus ~ .toggle-password {
            color: var(--primary-color);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #fff;
        }

        /* Options Row (Quên mật khẩu) */
        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .forgot-link {
            color: var(--primary-color);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .register-link {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        .register-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>

<body>

<div class="login-card">

    <!-- HEADER LOGO -->
    <div class="login-header">
        <a href="/" class="brand-logo">
            <i class="bi bi-tools"></i>T-<span class="accent">RIDE</span>
        </a>
        <h1>Chào mừng trở lại!</h1>
        <p>Vui lòng đăng nhập vào tài khoản của bạn</p>
    </div>

    <!-- THÔNG BÁO LỖI / THÀNH CÔNG THYMELEAF -->
    <div th:if="${param.error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Email hoặc mật khẩu không chính xác.</span>
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>Bạn đã đăng xuất thành công.</span>
    </div>

    <div th:if="${param.registered}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>Đăng ký thành công! Bạn có thể đăng nhập.</span>
    </div>

    <!-- FORM ĐĂNG NHẬP -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="email">Địa chỉ Email</label>
            <div class="input-wrapper">
                <input type="email"
                       id="email"
                       name="username"
                       class="form-input"
                       placeholder="nhapten@domain.com"
                       required
                       autocomplete="email">
                <i class="bi bi-envelope input-icon"></i>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
                <input type="password"
                       id="password"
                       name="password"
                       class="form-input"
                       placeholder="••••••••"
                       required>
                <i class="bi bi-lock input-icon"></i>
                <button type="button" class="toggle-password" id="togglePasswordBtn" title="Ẩn/Hiện mật khẩu">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <div class="form-options">
            <a th:href="@{/forgot-password}" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-submit">
            <span>Đăng nhập</span>
            <i class="bi bi-arrow-right-short" style="font-size: 20px;"></i>
        </button>

    </form>

    <!-- FOOTER -->
    <div class="login-footer">
        <span>Chưa có tài khoản?</span>
        <a th:href="@{/register}" class="register-link">Đăng ký ngay</a>
    </div>

</div>

<!-- SCRIPT HIỆU ỨNG ẨN/HIỆN MẬT KHẨU -->
<script>
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePasswordBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });
</script>

</body>
</html>
