<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Motorbike Garage</title>
</head>

<body>

<h1>Đăng nhập</h1>

<div th:if="${param.error}">
    <p style="color:red;">
        Email hoặc mật khẩu không chính xác.
    </p>
</div>

<div th:if="${param.logout}">
    <p style="color:green;">
        Bạn đã đăng xuất thành công.
    </p>
</div>

<div th:if="${param.registered}">
    <p style="color:green;">
        Đăng ký thành công. Hãy đăng nhập.
    </p>
</div>

<form th:action="@{/login}"
      method="post">

    <div>
        <label>Email</label>
        <input type="email"
               name="username"
               required>
    </div>

    <div>
        <label>Mật khẩu</label>
        <input type="password"
               name="password"
               required>
    </div>

    <button type="submit">
        Đăng nhập
    </button>

</form>

<p>
    Chưa có tài khoản?
    <a th:href="@{/register}">
        Đăng ký
    </a>
</p>

<p>
    <a th:href="@{/forgot-password}">
        Quên mật khẩu?
    </a>
</p>

</body>
</html>
