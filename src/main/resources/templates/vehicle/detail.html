<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi Tiết Xe - Motorbike Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/vehicle.css}">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container my-5">
  <div class="card shadow-lg">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Thông Tin Chi Tiết Xe: <span th:text="${vehicle.licensePlate}"></span></h4>
      <a th:href="@{/customer/vehicles}" class="btn btn-sm btn-light">Danh sách xe</a>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-5 text-center">
          <img th:src="${vehicle.imageUrl != null ? vehicle.imageUrl : '/images/vehicles/default-motorbike.png'}"
               class="img-fluid rounded border mb-3" alt="Vehicle Image">
        </div>
        <div class="col-md-7">
          <table class="table table-striped">
            <tbody>
            <tr><th>Biển số xe:</th> <td th:text="${vehicle.licensePlate}" class="fw-bold text-primary"></td></tr>
            <tr><th>Hãng xe:</th> <td th:text="${vehicle.brand}"></td></tr>
            <tr><th>Dòng xe:</th> <td th:text="${vehicle.model}"></td></tr>
            <tr><th>Màu sắc:</th> <td th:text="${vehicle.color}"></td></tr>
            <tr><th>Năm sản xuất:</th> <td th:text="${vehicle.manufactureYear}"></td></tr>
            <tr><th>Số khung:</th> <td th:text="${vehicle.chassisNumber}"></td></tr>
            <tr><th>Số máy:</th> <td th:text="${vehicle.engineNumber}"></td></tr>
            <tr><th>Chủ sở hữu:</th> <td th:text="${vehicle.ownerFullName}"></td></tr>
            <tr><th>Số điện thoại:</th> <td th:text="${vehicle.ownerPhone}"></td></tr>
            </tbody>
          </table>
          <div class="mt-4">
            <a th:href="@{/appointment/form(vehicleId=${vehicle.id})}" class="btn btn-primary">Đặt Lịch Sửa Chữa Cho Xe Này</a>
            <a th:href="@{/repair/history(vehicleId=${vehicle.id})}" class="btn btn-outline-secondary">Xem Lịch Sử Sửa Chữa</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
