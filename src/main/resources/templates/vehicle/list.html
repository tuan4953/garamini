<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Xe Của Tôi - Motorbike Garage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/vehicle.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Danh Sách Xe Của Tôi</h2>
        <a th:href="@{/customer/vehicles/add}" class="btn btn-primary">+ Thêm Xe Mới</a>
    </div>

    <div th:replace="~{fragments/alert :: alert}"></div>

    <div class="row" th:if="${not #lists.isEmpty(vehicles)}">
        <div class="col-md-4 mb-4" th:each="vehicle : ${vehicles}">
            <div class="card h-100 shadow-sm">
                <img th:src="${vehicle.imageUrl != null ? vehicle.imageUrl : '/images/vehicles/default-motorbike.png'}"
                     class="card-img-top" alt="Vehicle Image" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title text-uppercase font-weight-bold" th:text="${vehicle.licensePlate}">29A1-12345</h5>
                    <p class="card-text mb-1"><strong>Hãng xe:</strong> <span th:text="${vehicle.brand}">Honda</span></p>
                    <p class="card-text mb-1"><strong>Dòng xe:</strong> <span th:text="${vehicle.model}">SH 150i</span></p>
                    <p class="card-text mb-1"><strong>Màu sắc:</strong> <span th:text="${vehicle.color}">Đen</span></p>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
                    <a th:href="@{/customer/vehicles/{id}(id=${vehicle.id})}" class="btn btn-sm btn-outline-info">Chi tiết</a>
                    <a th:href="@{/appointment/form(vehicleId=${vehicle.id})}" class="btn btn-sm btn-outline-success">Đặt lịch sửa</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(vehicles)}" class="alert alert-warning text-center">
        Bạn chưa đăng ký chiếc xe nào trong hệ thống. <a th:href="@{/customer/vehicles/add}">Thêm ngay</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/vehicle.js}"></script>
</body>
</html>
