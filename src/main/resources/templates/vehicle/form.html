<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Xe - Motorbike Garage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/vehicle.css}">
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<div th:replace="~{fragments/navbar}"></div>

<div class="container my-5" style="max-width: 700px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${vehicleRequest.id == null ? 'Đăng Ký Xe Mới' : 'Cập Nhật Thông Tin Xe'}">Đăng Ký Xe</h4>
        </div>
        <div class="card-body">

            <!-- 1. BỔ SUNG: enctype="multipart/form-data" để tải lên file -->
            <form th:action="${vehicleRequest.id == null ? '/customer/vehicles/add' : '/admin/vehicles/edit/' + vehicleRequest.id}"
                  th:object="${vehicleRequest}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{ownerId}">

                <div class="mb-3">
                    <label for="licensePlate" class="form-label">Biển số xe (*):</label>
                    <input type="text" class="form-control" id="licensePlate" th:field="*{licensePlate}"
                           placeholder="VD: 29A1-12345" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="brand" class="form-label">Hãng xe (*):</label>
                        <input type="text" class="form-control" id="brand" th:field="*{brand}"
                               placeholder="VD: Honda, Yamaha" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="model" class="form-label">Dòng xe (*):</label>
                        <input type="text" class="form-control" id="model" th:field="*{model}"
                               placeholder="VD: SH 150i, Exciter" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="color" class="form-label">Màu sắc:</label>
                        <input type="text" class="form-control" id="color" th:field="*{color}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="manufactureYear" class="form-label">Năm sản xuất:</label>
                        <input type="number" class="form-control" id="manufactureYear" th:field="*{manufactureYear}" placeholder="2022">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="chassisNumber" class="form-label">Số khung:</label>
                        <input type="text" class="form-control" id="chassisNumber" th:field="*{chassisNumber}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="engineNumber" class="form-label">Số máy:</label>
                        <input type="text" class="form-control" id="engineNumber" th:field="*{engineNumber}">
                    </div>
                </div>

                <!-- 2. THAY ĐỔI: Tải lên hình ảnh từ thiết bị -->
                <div class="mb-3">
                    <label for="imageFile" class="form-label">Hình ảnh xe:</label>
                    <input type="file"
                           class="form-control"
                           id="imageFile"
                           name="imageFile"
                           accept="image/*"
                           onchange="previewImage(event)">
                    <div class="form-text">Cho phép định dạng: .jpg, .jpeg, .png</div>
                </div>

                <!-- Khu vực xem trước hình ảnh trước khi lưu -->
                <div class="mb-3 text-center" id="imagePreviewContainer" style="display: none;">
                    <img id="imagePreview" src="#" alt="Ảnh xe xem trước" class="img-thumbnail" style="max-height: 200px;">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/customer/vehicles}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-success">Lưu Thông Tin</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script xem trước ảnh khi chọn từ máy -->
<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('imagePreview');
            const container = document.getElementById('imagePreviewContainer');
            output.src = reader.result;
            container.style.display = 'block';
        };
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }
</script>
</body>
</html>
