<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Gara Motorbike</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container-fluid py-4">
  <h3 class="fw-bold text-dark mb-4"><i class="fas fa-tachometer-alt text-primary me-2"></i>Bảng Điều Khiển Quản Trị</h3>

  <!-- CARDS THỐNG KÊ -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card bg-primary text-white shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <small>Doanh thu tháng này</small>
            <h4 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">125,000,000 đ</h4>
          </div>
          <i class="fas fa-coins fa-2x opacity-50"></i>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card bg-success text-white shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <small>Phiếu sửa xong</small>
            <h4 class="fw-bold mb-0" th:text="${stats.completedInvoices}">48</h4>
          </div>
          <i class="fas fa-check-circle fa-2x opacity-50"></i>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card bg-warning text-dark shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <small>Lịch hẹn chờ duyệt</small>
            <h4 class="fw-bold mb-0" th:text="${stats.pendingAppointments}">12</h4>
          </div>
          <i class="fas fa-calendar-alt fa-2x opacity-50"></i>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card bg-info text-white shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <small>Đánh giá Trung Bình</small>
            <h4 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(stats.avgRating, 1, 1)} + ' ★'">4.8 ★</h4>
          </div>
          <i class="fas fa-star fa-2x opacity-50"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- QUICK LINKS -->
  <div class="row g-3">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-3">
        <h5 class="fw-bold"><i class="fas fa-newspaper me-2 text-primary"></i>Tin tức</h5>
        <p class="text-muted small">Đã xuất bản: <strong th:text="${stats.publishedNews}">5</strong> bài viết</p>
        <a th:href="@{/admin/news}" class="btn btn-sm btn-outline-primary">Quản lý tin tức</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-3">
        <h5 class="fw-bold"><i class="fas fa-tags me-2 text-success"></i>Khuyến mãi</h5>
        <p class="text-muted small">Mã đang chạy: <strong th:text="${stats.activePromotions}">3</strong> mã</p>
        <a th:href="@{/admin/promotions}" class="btn btn-sm btn-outline-success">Quản lý khuyến mãi</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-3">
        <h5 class="fw-bold"><i class="fas fa-comments me-2 text-warning"></i>Phản hồi</h5>
        <p class="text-muted small">Tổng số đánh giá: <strong th:text="${stats.totalReviews}">15</strong> lượt</p>
        <a th:href="@{/admin/reviews}" class="btn btn-sm btn-outline-warning">Xem đánh giá</a>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/footer}"></div>

</body>
</html>
