<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Phiếu Sửa Chữa - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

  <div class="admin-main-container">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="admin-content">
      <div class="container-fluid" style="max-width: 800px;">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold">Tạo Phiếu Sửa Chữa Mới</h5>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/admin/repairs/create}" th:object="${repairRequest}" method="post">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">ID Xe <span class="text-danger">*</span></label>
                  <input type="number" th:field="*{vehicleId}" class="form-control" required placeholder="Nhập ID phương tiện">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">ID Khách Hàng <span class="text-danger">*</span></label>
                  <input type="number" th:field="*{customerId}" class="form-control" required placeholder="Nhập ID khách hàng">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">ID Kỹ Thuật Viên Phụ Trách</label>
                  <input type="number" th:field="*{technicianId}" class="form-control" placeholder="Nhập ID kỹ thuật viên (nếu có)">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">ID Phiếu Kiểm Tra</label>
                  <input type="number" th:field="*{inspectionId}" class="form-control" placeholder="Nhập ID phiếu inspection (nếu có)">
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold">Ghi Chú Yêu Cầu</label>
                  <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Ghi chú về tình trạng hỏng hóc..."></textarea>
                </div>
              </div>

              <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/admin/repairs}" class="btn btn-secondary">Quay lại</a>
                <button type="submit" class="btn btn-primary fw-bold">Lưu Đơn Sửa Chữa</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
