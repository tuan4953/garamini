<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Kho Phụ Tùng - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

  <div class="admin-main-container">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="admin-content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-box-seam"></i> Quản Lý Kho Phụ Tùng & Linh Kiện</h2>
    <a th:href="@{/admin/spare-parts/create}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Thêm Phụ Tùng Mới</a>
  </div>

  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Tìm kiếm -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form th:action="@{/admin/spare-parts}" method="get" class="row g-3">
        <div class="col-md-6">
          <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên phụ tùng...">
        </div>
        <div class="col-md-4">
          <select name="active" class="form-select">
            <option value="">-- Tất cả trạng thái --</option>
            <option value="true" th:selected="${active == true}">Đang kinh doanh</option>
            <option value="false" th:selected="${active == false}">Ngừng kinh doanh</option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search"></i> Tìm kiếm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Danh sách -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Tên Phụ Tùng</th>
          <th>Đơn Giá</th>
          <th>Tồn Kho</th>
          <th>Đơn Vị Tính</th>
          <th>Trạng Thái</th>
          <th class="text-center">Thao Tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sp : ${sparePartsPage.content}">
          <td th:text="${sp.id}"></td>
          <td class="fw-bold" th:text="${sp.name}"></td>
          <td class="text-primary fw-bold" th:text="${#numbers.formatDecimal(sp.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
          <td>
            <span class="badge" th:classappend="${sp.stockQuantity > 5 ? 'bg-info' : 'bg-danger'}" th:text="${sp.stockQuantity}"></span>
          </td>
          <td th:text="${sp.unit}"></td>
          <td>
            <span class="badge" th:classappend="${sp.active ? 'bg-success' : 'bg-secondary'}" th:text="${sp.active ? 'Kinh doanh' : 'Ngừng'}"></span>
          </td>
          <td class="text-center">
            <a th:href="@{/admin/spare-parts/{id}/edit(id=${sp.id})}" class="btn btn-sm btn-warning me-1"><i class="bi bi-pencil-square"></i> Sửa</a>
            <form th:action="@{/admin/spare-parts/{id}/toggle-status(id=${sp.id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm" th:classappend="${sp.active ? 'btn-outline-danger' : 'btn-outline-success'}">
                <span th:text="${sp.active ? 'Ẩn' : 'Hiện'}"></span>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${!sparePartsPage.hasContent()}">
          <td colspan="7" class="text-center text-muted py-4">Không tìm thấy phụ tùng nào.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
    </main>
  </div>
  <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
