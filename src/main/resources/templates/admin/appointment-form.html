<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Lịch Hẹn - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <div class="container-fluid p-4" style="max-width: 800px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Cập Nhật Trạng Thái Lịch Hẹn #APT-[[${appointmentDetail.id}]]</h4>
            </div>
            <div class="card-body">
                <!-- Thông tin tóm tắt -->
                <div class="row mb-4 p-3 bg-light rounded">
                    <div class="col-md-6">
                        <p class="mb-1"><strong>Khách hàng:</strong> <span th:text="${appointmentDetail.customerName}"></span></p>
                        <p class="mb-1"><strong>SĐT:</strong> <span th:text="${appointmentDetail.customerPhone}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p class="mb-1"><strong>Biển số xe:</strong> <span th:text="${appointmentDetail.licensePlate}" class="fw-bold"></span></p>
                        <p class="mb-1"><strong>Dòng xe:</strong> <span th:text="${appointmentDetail.vehicleBrand + ' ' + appointmentDetail.vehicleModel}"></span></p>
                    </div>
                </div>

                <form th:action="@{/admin/appointments/edit/{id}(id=${appointmentUpdateRequest.id})}"
                      th:object="${appointmentUpdateRequest}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="appointmentDate" class="form-label">Thời Gian Hẹn:</label>
                        <input type="datetime-local" class="form-control" id="appointmentDate" th:field="*{appointmentDate}" required>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Trạng Thái Lịch Hẹn (*):</label>
                        <select class="form-select" id="status" th:field="*{status}" required>
                            <option th:each="st : ${statuses}"
                                    th:value="${st}"
                                    th:text="${st}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">Ghi Chú Yêu Cầu Của Khách:</label>
                        <textarea class="form-control" id="notes" th:field="*{notes}" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="cancellationReason" class="form-label">Lý Do Hủy (Nếu có):</label>
                        <input type="text" class="form-control" id="cancellationReason" th:field="*{cancellationReason}">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/admin/appointments}" class="btn btn-secondary">Quay lại</a>
                        <button type="submit" class="btn btn-success">Cập Nhật Trạng Thái</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
