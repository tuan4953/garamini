<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Lịch Hẹn - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div class="container-fluid" style="max-width: 800px;">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white py-3">
                        <h5 class="mb-0 fw-bold">Cập Nhật Trạng Thái Lịch Hẹn #APT-[[${appointmentDetail.id}]]</h5>
                    </div>
                    <div class="card-body p-4">
                        <!-- Thông tin tóm tắt -->
                        <div class="row mb-4 p-3 bg-light rounded-3">
                            <div class="col-md-6">
                                <p class="mb-1"><strong>Khách hàng:</strong> <span th:text="${appointmentDetail.customerName}"></span></p>
                                <p class="mb-1"><strong>SĐT:</strong> <span th:text="${appointmentDetail.customerPhone}"></span></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-1"><strong>Biển số xe:</strong> <span th:text="${appointmentDetail.licensePlate}" class="fw-bold"></span></p>
                                <p class="mb-1"><strong>Dòng xe:</strong> <span th:text="${appointmentDetail.vehicleBrand + ' ' + appointmentDetail.vehicleModel}"></span></p>
                            </div>
                        </div>

                        <form th:action="@{/admin/appointments/edit/{id}(id=${appointmentUpdateRequest.id})}"
                              th:object="${appointmentUpdateRequest}" method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="appointmentDate" class="form-label fw-semibold">Thời Gian Hẹn:</label>
                                <input type="datetime-local" class="form-control" id="appointmentDate" th:field="*{appointmentDate}" required>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label fw-semibold">Trạng Thái Lịch Hẹn (*):</label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option th:each="st : ${statuses}"
                                            th:value="${st}"
                                            th:text="${st}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="notes" class="form-label fw-semibold">Ghi Chú Yêu Cầu Của Khách:</label>
                                <textarea class="form-control" id="notes" th:field="*{notes}" rows="3"></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="cancellationReason" class="form-label fw-semibold">Lý Do Hủy (Nếu có):</label>
                                <input type="text" class="form-control" id="cancellationReason" th:field="*{cancellationReason}">
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/appointments}" class="btn btn-secondary">Quay lại</a>
                                <button type="submit" class="btn btn-success fw-bold">Cập Nhật Trạng Thái</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
