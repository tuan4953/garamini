<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Báo Giá - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

  <div class="admin-main-container">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <main class="admin-content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-file-earmark-spreadsheet"></i> Quản Lý Báo Giá</h2>
    <a th:href="@{/admin/quotations/create}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Tạo Báo Giá Mới</a>
  </div>

  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form th:action="@{/admin/quotations}" method="get" class="row g-3">
        <div class="col-md-5">
          <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo mã báo giá, biển số xe, tên KH...">
        </div>
        <div class="col-md-4">
          <select name="status" class="form-select">
            <option value="">-- Tất cả trạng thái --</option>
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search"></i> Lọc dữ liệu</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
        <tr>
          <th>Mã Báo Giá</th>
          <th>Biển Số Xe</th>
          <th>Khách Hàng</th>
          <th>Trạng Thái</th>
          <th>Tổng Tiền</th>
          <th class="text-center">Thao Tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="q : ${quotationsPage.content}">
          <td th:text="${q.quotationCode}" class="fw-bold text-primary"></td>
          <td th:text="${q.licensePlate}"></td>
          <td>
            <div class="fw-bold" th:text="${q.customerName}"></div>
            <small class="text-muted" th:text="${q.customerPhone}"></small>
          </td>
          <td>
            <span class="badge" th:classappend="${q.status.name() == 'ACCEPTED' ? 'bg-success' : (q.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${q.status}"></span>
          </td>
          <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(q.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
          <td class="text-center">
            <a th:href="@{/admin/quotations/{id}(id=${q.id})}" class="btn btn-sm btn-info text-white"><i class="bi bi-eye"></i> Chi tiết</a>
          </td>
        </tr>
        <tr th:if="${!quotationsPage.hasContent()}">
          <td colspan="6" class="text-center text-muted py-4">Chưa có bảng báo giá nào.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
    </main>
  </div>
  <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
