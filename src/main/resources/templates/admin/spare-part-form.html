<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${sparePartId == null ? 'Thêm Phụ Tùng' : 'Cập Nhật Phụ Tùng'}">Cấu hình Phụ Tùng - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div class="container-fluid" style="max-width: 800px;">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-success text-white py-3">
                        <h5 class="mb-0 fw-bold" th:text="${sparePartId == null ? 'Thêm Phụ Tùng Mới' : 'Cập Nhật Phụ Tùng'}"></h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${sparePartId == null ? '/admin/spare-parts/create' : '/admin/spare-parts/' + sparePartId + '/edit'}"
                              th:object="${sparePartRequest}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên Phụ Tùng <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid" placeholder="Nhập tên linh kiện, phụ tùng...">
                                <div class="invalid-feedback" th:errors="*{name}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{price}" class="form-control" th:errorclass="is-invalid" placeholder="0">
                                    <div class="invalid-feedback" th:errors="*{price}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Số Lượng Tồn Kho <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{stockQuantity}" class="form-control" th:errorclass="is-invalid" placeholder="0">
                                    <div class="invalid-feedback" th:errors="*{stockQuantity}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Đơn Vị Tính</label>
                                <input type="text" th:field="*{unit}" class="form-control" placeholder="Cái, Chai, Bộ, Lít...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mô Tả Chức Năng</label>
                                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả thông số kỹ thuật..."></textarea>
                            </div>

                            <div class="form-check mb-4">
                                <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck">
                                <label class="form-check-label" for="activeCheck">Cho phép kinh doanh ngay</label>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/spare-parts}" class="btn btn-secondary">Hủy bỏ</a>
                                <button type="submit" class="btn btn-success fw-bold">Lưu Thông Tin</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
