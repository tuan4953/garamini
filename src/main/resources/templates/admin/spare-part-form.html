<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${sparePartId == null ? 'Thêm Phụ Tùng' : 'Cập Nhật Phụ Tùng'}">Cấu hình Phụ Tùng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0" th:text="${sparePartId == null ? 'Thêm Phụ Tùng Mới' : 'Cập Nhật Phụ Tùng'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="${sparePartId == null ? '/admin/spare-parts/create' : '/admin/spare-parts/' + sparePartId + '/edit'}"
                          th:object="${sparePartRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Tên Phụ Tùng <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid" placeholder="Nhập tên linh kiện, phụ tùng...">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{price}" class="form-control" th:errorclass="is-invalid" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số Lượng Tồn Kho <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{stockQuantity}" class="form-control" th:errorclass="is-invalid" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{stockQuantity}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Đơn Vị Tính</label>
                            <input type="text" th:field="*{unit}" class="form-control" placeholder="Cái, Chai, Bộ, Lít...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mô Tả Chức Năng</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả thông số kỹ thuật..."></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck">
                            <label class="form-check-label" for="activeCheck">Cho phép kinh doanh ngay</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/spare-parts}" class="btn btn-secondary">Hủy bỏ</a>
                            <button type="submit" class="btn btn-success">Lưu Thông Tin</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
