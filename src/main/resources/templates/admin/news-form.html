<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biên Tập Bài Viết - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div style="max-width: 900px;">

                <!-- Tiêu đề trang -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">
                            <i class="bi bi-newspaper text-primary me-2"></i>
                            <span th:text="${newsRequest.id == null ? 'Thêm bài viết mới' : 'Chỉnh sửa bài viết'}">Thêm bài viết</span>
                        </h3>
                        <p class="text-muted mb-0">Quản lý nội dung tin tức &amp; bài viết</p>
                    </div>
                    <a th:href="@{/admin/news}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <!-- Card form -->
                <div class="admin-card">
                    <form th:action="@{/admin/news/save}" th:object="${newsRequest}" method="POST">
                        <input type="hidden" th:field="*{id}">

                        <!-- Tiêu đề -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Tiêu đề bài viết <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{title}"
                                   placeholder="Nhập tiêu đề tin tức..." required>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}"></div>
                        </div>

                        <!-- Ảnh đại diện -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Đường dẫn ảnh đại diện (URL)</label>
                            <input type="url" class="form-control" th:field="*{imageUrl}"
                                   placeholder="https://example.com/image.jpg">
                        </div>

                        <!-- Tóm tắt -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tóm tắt ngắn</label>
                            <textarea class="form-control" th:field="*{summary}" rows="3"
                                      placeholder="Mô tả ngắn gọn hiển thị ngoài danh sách..."></textarea>
                        </div>

                        <!-- Nội dung -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Nội dung chi tiết <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" th:field="*{content}" rows="12"
                                      placeholder="Soạn thảo nội dung bài viết..." required></textarea>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('content')}"
                                 th:errors="*{content}"></div>
                        </div>

                        <!-- Xuất bản -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox"
                                   th:field="*{published}" id="publishedCheck">
                            <label class="form-check-label fw-semibold" for="publishedCheck">
                                Xuất bản ngay lập tức
                            </label>
                        </div>

                        <!-- Nút -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary fw-bold px-4">
                                <i class="fas fa-save me-1"></i> Lưu bài viết
                            </button>
                            <a th:href="@{/admin/news}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i> Hủy bỏ
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
