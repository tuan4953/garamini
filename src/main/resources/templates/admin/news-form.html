<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Biên tập Bài viết - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark" th-text="${newsRequest.id == null ? 'Thêm bài viết mới' : 'Chỉnh sửa bài viết'}">Thêm bài viết</h3>
    <a th:href="@{/admin/news}" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-1"></i> Quay lại
    </a>
  </div>

  <div class="card shadow-sm border-0 p-4">
    <form th:action="@{/admin/news/save}" th:object="${newsRequest}" method="POST">
      <input type="hidden" th:field="*{id}" />

      <div class="mb-3">
        <label class="form-label fw-bold">Tiêu đề bài viết (*)</label>
        <input type="text" class="form-control" th:field="*{title}" placeholder="Nhập tiêu đề tin tức..." required />
        <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Đường dẫn ảnh đại diện (URL)</label>
        <input type="url" class="form-control" th:field="*{imageUrl}" placeholder="https://example.com/image.jpg" />
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Tóm tắt ngắn</label>
        <textarea class="form-control" th:field="*{summary}" rows="3" placeholder="Mô tả ngắn gọn hiển thị ngoài danh sách..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Nội dung chi tiết (*)</label>
        <textarea class="form-control" th:field="*{content}" rows="10" placeholder="Soạn thảo nội dung bài viết..." required></textarea>
        <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" th:field="*{published}" id="publishedCheck">
        <label class="form-check-label fw-bold" for="publishedCheck">
          Xuất bản ngay lập tức
        </label>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary fw-bold px-4">
          <i class="fas fa-save me-1"></i> Lưu bài viết
        </button>
        <a th:href="@{/admin/news}" class="btn btn-outline-secondary">Hủy bỏ</a>
      </div>
    </form>
  </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
