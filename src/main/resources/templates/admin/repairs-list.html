<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Đơn Sửa Chữa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container-fluid p-4">
  <h2>Quản Lý Tiến Độ Sửa Chữa Xe</h2>
  <hr>
  <form th:action="@{/admin/repairs}" method="get" class="row g-3 mb-3">
    <div class="col-md-4">
      <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Mã đơn, Biển số xe, Tên KH...">
    </div>
    <div class="col-md-3">
      <select name="status" class="form-select">
        <option value="">-- Tất cả trạng thái --</option>
        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
    </div>
  </form>

  <table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
    <tr>
      <th>Mã Đơn</th>
      <th>Biển Số Xe</th>
      <th>Khách Hàng</th>
      <th>Kỹ Thuật Viên</th>
      <th>Trạng Thái</th>
      <th>Tổng Tiền</th>
      <th>Thao Tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="o : ${ordersPage.content}">
      <td th:text="${o.orderCode}" class="fw-bold"></td>
      <td th:text="${o.licensePlate}"></td>
      <td th:text="${o.customerName}"></td>
      <td th:text="${o.technicianName}"></td>
      <td>
        <span class="badge bg-info" th:text="${o.status}"></span>
      </td>
      <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
      <td>
        <a th:href="@{/repairs/{id}(id=${o.id})}" class="btn btn-sm btn-outline-info">Xem</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
