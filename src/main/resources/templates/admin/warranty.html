<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bảo Hành - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0"><i class="bi bi-shield-check text-primary me-2"></i>Quản Lý Thẻ Bảo Hành</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createWarrantyModal">
                    <i class="bi bi-plus-lg me-1"></i> Cấp Thẻ Bảo Hành
                </button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="admin-table-card">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Mã BH</th>
                        <th>Khách Hàng (ID)</th>
                        <th>Biển Số Xe</th>
                        <th>Hạng Mục / Phụ Tùng</th>
                        <th>Ngày Bắt Đầu</th>
                        <th>Ngày Hết Hạn</th>
                        <th>Trạng Thái</th>
                        <th>Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(warranties)}">
                        <td colspan="8" class="text-center py-4 text-muted">Chưa có dữ liệu bảo hành.</td>
                    </tr>
                    <tr th:each="w : ${warranties}">
                        <td th:text="'#BH-' + ${w.id}">#BH-1</td>
                        <td th:text="${w.customerName} + ' (ID: ' + ${w.customerId} + ')'">Nguyễn Văn A</td>
                        <td th:text="${w.licensePlate}">29A-12345</td>
                        <td th:text="${w.itemOrService}">Thay Lốp Michelin</td>
                        <td th:text="${w.startDate}">2026-01-01</td>
                        <td th:text="${w.expiryDate}">2027-01-01</td>
                        <td>
                            <span class="badge bg-success" th:if="${w.active}">Còn Hạn</span>
                            <span class="badge bg-danger" th:unless="${w.active}">Hết Hạn</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/warranty/{id}/delete(id=${w.id})}" method="post" onsubmit="return confirm('Xóa thẻ bảo hành này?');">
                                <button class="btn btn-sm btn-outline-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>

<!-- Modal Tạo Thẻ Bảo Hành -->
<div class="modal fade" id="createWarrantyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/warranty/create}" th:object="${newWarranty}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Cấp Thẻ Bảo Hành Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">ID Khách Hàng</label>
                        <input type="number" class="form-control" th:field="*{customerId}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tên Khách Hàng</label>
                        <input type="text" class="form-control" th:field="*{customerName}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Biển Số Xe</label>
                        <input type="text" class="form-control" th:field="*{licensePlate}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hạng Mục / Phụ Tùng Bảo Hành</label>
                        <input type="text" class="form-control" th:field="*{itemOrService}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ngày Bắt Đầu</label>
                            <input type="date" class="form-control" th:field="*{startDate}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ngày Hết Hạn</label>
                            <input type="date" class="form-control" th:field="*{expiryDate}" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Tạo Bảo Hành</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
