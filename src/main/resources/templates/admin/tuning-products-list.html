<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Gói Độ Xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-speedometer2"></i> Quản Lý Gói Độ & Phụ Kiện Xe</h2>
        <a th:href="@{/admin/tuning/products/create}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Thêm Gói Độ Mới</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Bộ lọc -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/admin/tuning/products}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên sản phẩm, phụ kiện độ...">
                </div>
                <div class="col-md-4">
                    <select name="categoryId" class="form-select">
                        <option value="">-- Tất cả danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategory}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search"></i> Lọc dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Danh sách sản phẩm dạng Bảng -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Hình Ảnh</th>
                    <th>Tên Gói / Phụ Kiện</th>
                    <th>Danh Mục</th>
                    <th>Đơn Giá</th>
                    <th>Tồn Kho</th>
                    <th>Trạng Thái</th>
                    <th class="text-center">Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productsPage.content}">
                    <td th:text="${p.id}"></td>
                    <td>
                        <img th:src="${!#strings.isEmpty(p?.imageUrl) ? p.imageUrl : 'https://via.placeholder.com/60'}"
                             alt="product" class="rounded border" style="width: 50px; height: 50px; object-fit: cover;">
                    </td>
                    <td>
                        <div class="fw-bold" th:text="${p.name}"></div>
                        <small class="text-muted" th:text="${p.description}"></small>
                    </td>
                    <td><span class="badge bg-secondary" th:text="${p.categoryName}"></span></td>
                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td><span class="badge bg-info" th:text="${p.stockQuantity}"></span></td>
                    <td>
                            <span class="badge" th:classappend="${p.active ? 'bg-success' : 'bg-danger'}"
                                  th:text="${p.active ? 'Đang bán' : 'Tạm ngưng'}"></span>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil-square"></i> Sửa</button>
                    </td>
                </tr>
                <tr th:if="${productsPage == null or #lists.isEmpty(productsPage.content)}">
                    <td colspan="8" class="text-center text-muted py-4">Chưa có sản phẩm độ xe nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
