<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Cứu Hộ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-truck-front-fill text-danger"></i> Danh Sách Yêu Cầu Cứu Hộ</h2>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Bộ lọc -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/admin/rescue}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo địa điểm, tên KH, SĐT...">
                </div>
                <div class="col-md-4">
                    <select name="status" class="form-select">
                        <option value="">-- Tất cả trạng thái --</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search"></i> Lọc dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng dữ liệu -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Khách Hàng</th>
                    <th>Biển Số Xe</th>
                    <th>Vị Trí Cứu Hộ</th>
                    <th>Kỹ Thuật Viên</th>
                    <th>Trạng Thái</th>
                    <th>Thời Gian</th>
                    <th class="text-center">Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rescuePage.content}">
                    <td th:text="${r.id}"></td>
                    <td>
                        <div class="fw-bold" th:text="${r.customerName}"></div>
                        <small class="text-muted" th:text="${r.customerPhone}"></small>
                    </td>
                    <td th:text="${r.licensePlate}"></td>
                    <td th:text="${r.location}"></td>
                    <td th:text="${r.technicianName}"></td>
                    <td>
                        <span class="badge" th:classappend="${r.status.name() == 'PENDING' ? 'bg-danger' : (r.status.name() == 'IN_PROGRESS' ? 'bg-warning text-dark' : (r.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-secondary'))}" th:text="${r.status}"></span>
                    </td>
                    <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-center">
                        <a th:href="@{/admin/rescue/{id}(id=${r.id})}" class="btn btn-sm btn-primary"><i class="bi bi-gear-fill"></i> Xử lý</a>
                    </td>
                </tr>
                <tr th:if="${rescuePage.content.empty}">
                    <td colspan="8" class="text-center text-muted py-4">Chưa có yêu cầu cứu hộ nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
