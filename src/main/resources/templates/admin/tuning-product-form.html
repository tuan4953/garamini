<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm / Sửa Gói Độ Xe - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div style="max-width: 820px;">

                <!-- Tiêu đề trang -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">
                            <i class="bi bi-lightning-charge-fill text-warning me-2"></i>Thêm / Sửa Gói Độ Xe
                        </h3>
                        <p class="text-muted mb-0">Quản lý sản phẩm độ xe và phụ kiện</p>
                    </div>
                    <a th:href="@{/admin/tuning/products}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Trở lại danh sách
                    </a>
                </div>

                <!-- Thông báo lỗi chung -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form -->
                <div class="admin-card">
                    <form th:action="@{/admin/tuning/products/create}" th:object="${productRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Tên Gói Độ / Linh Kiện <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:errorclass="is-invalid"
                                   placeholder="VD: Độ mâm Porsche 19 inch, Cánh gió carbon...">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Danh Mục</label>
                                <select th:field="*{categoryId}" class="form-select">
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Link Hình Ảnh (URL)</label>
                                <input type="text" th:field="*{imageUrl}" class="form-control"
                                       placeholder="https://example.com/image.jpg">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    Đơn Giá (VNĐ) <span class="text-danger">*</span>
                                </label>
                                <input type="number" th:field="*{price}" class="form-control"
                                       th:errorclass="is-invalid" min="0" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    Số Lượng Tồn Kho <span class="text-danger">*</span>
                                </label>
                                <input type="number" th:field="*{stockQuantity}" class="form-control"
                                       th:errorclass="is-invalid" min="0" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{stockQuantity}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô Tả Chi Tiết / Thông Số</label>
                            <textarea th:field="*{description}" class="form-control" rows="4"
                                      placeholder="Mô tả công suất, chất liệu, tính năng..."></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck">
                            <label class="form-check-label fw-semibold" for="activeCheck">
                                Cho phép hiển thị &amp; đặt hàng ngay
                            </label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/tuning/products}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i> Hủy
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">
                                <i class="bi bi-save me-1"></i> Lưu Sản Phẩm
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
