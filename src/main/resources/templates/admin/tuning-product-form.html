<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Gói Độ Xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Thêm Gói Độ / Phụ Kiện Mới</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/tuning/products/create}" th:object="${productRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Tên Gói Độ / Linh Kiện <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid" placeholder="VD: Độ mâm xe Porche 19 inch, Cánh gió carbon...">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Danh Mục</label>
                                <select th:field="*{categoryId}" class="form-select">
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Link Hình Ảnh (URL)</label>
                                <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/image.jpg">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{price}" class="form-control" th:errorclass="is-invalid" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số Lượng Tồn Kho <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{stockQuantity}" class="form-control" th:errorclass="is-invalid" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{stockQuantity}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mô Tả Chi Tiết / Thông Số</label>
                            <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Mô tả công suất, chất liệu, tính năng..."></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck">
                            <label class="form-check-label" for="activeCheck">Cho phép hiển thị & đặt hàng ngay</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/tuning/products}" class="btn btn-secondary">Trở lại</a>
                            <button type="submit" class="btn btn-primary">Lưu Sản Phẩm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
