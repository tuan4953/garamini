<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biên tập Khuyến mãi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark" th:text="${promotionRequest.id == null ? 'Tạo mới mã khuyến mãi' : 'Chỉnh sửa mã khuyến mãi'}">Tạo khuyến mãi</h3>
        <a th:href="@{/admin/promotions}" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm border-0 p-4">
        <form th:action="@{/admin/promotions/save}" th:object="${promotionRequest}" method="POST">
            <input type="hidden" th:field="*{id}" />

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Mã CODE (*)</label>
                    <input type="text" class="form-control text-uppercase" th:field="*{code}" placeholder="VD: SUMMERSALE" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th-errors="*{code}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Tên chương trình (*)</label>
                    <input type="text" class="form-control" th:field="*{title}" placeholder="Nhập tên khuyến mãi..." required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th-errors="*{title}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Mức giảm theo %</label>
                    <input type="number" class="form-control" th:field="*{discountPercent}" placeholder="VD: 10 (Giảm 10%)" min="0" max="100" />
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Mức giảm theo Số tiền (VNĐ)</label>
                    <input type="number" class="form-control" th:field="*{discountAmount}" placeholder="VD: 50000" min="0" step="1000" />
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Ngày bắt đầu (*)</label>
                    <input type="date" class="form-control" th:field="*{startDate}" required />
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Ngày kết thúc (*)</label>
                    <input type="date" class="form-control" th:field="*{endDate}" required />
                </div>

                <div class="col-12">
                    <label class="form-label fw-bold">Mô tả chi tiết</label>
                    <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Điều kiện áp dụng..."></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label fw-bold" for="activeCheck">Kích hoạt mã này ngay</label>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary fw-bold px-4"><i class="fas fa-save me-1"></i> Lưu mã</button>
                <a th:href="@{/admin/promotions}" class="btn btn-outline-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
