<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Phiếu Sửa Chữa - Admin T-RIDE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .item-row {
            background: #fdfdfd;
            border-radius: 8px;
            border: 1px dashed #dee2e6;
            padding: 10px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div class="container-fluid" style="max-width: 900px;">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square text-warning me-2"></i>Chỉnh Sửa Phiếu #<span class="text-warning" th:text="${repair.orderCode}"></span></h5>
                        <a th:href="@{/admin/repairs}" class="btn btn-sm btn-light fw-bold">&larr; Danh sách</a>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/repairs/{id}/edit(id=${repair.id})}" method="post">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Phương Tiện <span class="text-danger">*</span></label>
                                    <select name="vehicleId" id="vehicleSelect" class="form-select" required onchange="onVehicleChange(this)">
                                        <option th:each="v : ${vehicles}"
                                                th:value="${v.id}"
                                                th:data-owner-id="${v.owner != null ? v.owner.id : ''}"
                                                th:selected="${v.id == repair.vehicleId}"
                                                th:text="${v.licensePlate + ' - ' + v.brand + ' ' + v.model + ' (Chủ: ' + (v.owner != null ? v.owner.fullName : 'N/A') + ')'}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Khách Hàng</label>
                                    <select name="customerId" id="customerSelect" class="form-select">
                                        <option th:each="c : ${customers}"
                                                th:value="${c.id}"
                                                th:selected="${c.id == repair.customerId}"
                                                th:text="${c.fullName + ' - SĐT: ' + c.phone}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Kỹ Thuật Viên Phụ Trách</label>
                                    <select name="technicianId" class="form-select">
                                        <option value="">-- Chưa phân công --</option>
                                        <option th:each="t : ${technicians}"
                                                th:value="${t.id}"
                                                th:selected="${t.id == repair.technicianId}"
                                                th:text="${t.fullName + ' (' + t.role + ')'}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Trạng Thái</label>
                                    <select name="status" class="form-select">
                                        <option th:each="st : ${statuses}"
                                                th:value="${st}"
                                                th:selected="${st == repair.status}"
                                                th:text="${st.name() == 'RECEIVING' ? 'TIẾP NHẬN' : (st.name() == 'DIAGNOSING' ? 'CHẨN ĐOÁN' : (st.name() == 'IN_PROGRESS' ? 'ĐANG SỬA CHỮA' : (st.name() == 'COMPLETED' ? 'HOÀN THÀNH' : 'ĐÃ HỦY')))}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Ghi Chú Tiến Độ</label>
                                    <textarea name="note" class="form-control" rows="3" th:text="${repair.note}"></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
                                <h6 class="fw-bold mb-0 text-dark"><i class="bi bi-card-checklist me-1 text-primary"></i>Danh Mục Dịch Vụ & Phụ Tùng</h6>
                                <button type="button" class="btn btn-sm btn-outline-primary fw-semibold" onclick="addItemRow()">
                                    <i class="bi bi-plus"></i> Thêm Hạng Mục
                                </button>
                            </div>

                            <div id="itemsContainer" class="p-2 bg-light rounded-3 border mb-3"></div>

                            <div class="d-flex justify-content-end align-items-center gap-3 p-3 bg-light rounded mb-4">
                                <span class="fw-bold text-secondary">Tổng Tiền Ước Tính:</span>
                                <span id="totalDisplay" class="fs-5 fw-bold text-danger">0 đ</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/repairs}" class="btn btn-secondary">Hủy bỏ</a>
                                <button type="submit" class="btn btn-success fw-bold px-4"><i class="bi bi-check-circle me-1"></i>Lưu Thay Đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const activeServices = /*[[${services}]]*/ [];
    const activeSpareParts = /*[[${spareParts}]]*/ [];
    const existingItems = /*[[${repair.items}]]*/ [];
    /*]]>*/

    function onVehicleChange(selectEl) {
        const selectedOption = selectEl.options[selectEl.selectedIndex];
        const ownerId = selectedOption.getAttribute('data-owner-id');
        const customerSelect = document.getElementById('customerSelect');
        if (customerSelect && ownerId) {
            customerSelect.value = ownerId;
        }
    }

    function formatCurrency(amount) {
        if (!amount && amount !== 0) return '0 đ';
        return new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
    }

    function addItemRow(itemData = null) {
        const container = document.getElementById('itemsContainer');
        const index = container.children.length;

        const row = document.createElement('div');
        row.className = 'item-row';
        row.id = `row_${index}`;

        const isService = itemData ? (itemData.type === 'DỊCH VỤ' || (itemData.serviceId && !itemData.sparePartId)) : true;
        const selectedType = isService ? 'SERVICE' : 'SPARE_PART';
        const selectedServiceId = itemData && itemData.serviceId ? itemData.serviceId : '';
        const selectedSparePartId = itemData && itemData.sparePartId ? itemData.sparePartId : '';
        const qty = itemData && itemData.quantity ? itemData.quantity : 1;
        const unitPrice = itemData && itemData.unitPrice ? itemData.unitPrice : 0;
        const total = qty * unitPrice;

        let serviceOptions = `<option value="">-- Chọn dịch vụ --</option>`;
        activeServices.forEach(s => {
            const sel = (s.id == selectedServiceId) ? 'selected' : '';
            serviceOptions += `<option value="${s.id}" data-price="${s.price}" ${sel}>${s.name} (${formatCurrency(s.price)})</option>`;
        });

        let sparePartOptions = `<option value="">-- Chọn phụ tùng --</option>`;
        activeSpareParts.forEach(p => {
            const sel = (p.id == selectedSparePartId) ? 'selected' : '';
            sparePartOptions += `<option value="${p.id}" data-price="${p.price}" ${sel}>${p.name} (${formatCurrency(p.price)})</option>`;
        });

        row.innerHTML = `
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <select name="items[${index}].type" class="form-select form-select-sm" onchange="toggleItemType(this, ${index})">
                        <option value="SERVICE" ${selectedType === 'SERVICE' ? 'selected' : ''}>🛠 Dịch vụ sửa chữa</option>
                        <option value="SPARE_PART" ${selectedType === 'SPARE_PART' ? 'selected' : ''}>📦 Phụ tùng linh kiện</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select name="items[${index}].serviceId" id="service_${index}" class="form-select form-select-sm ${selectedType === 'SERVICE' ? '' : 'd-none'}" onchange="onSelectItem(this, ${index})">
                        ${serviceOptions}
                    </select>
                    <select name="items[${index}].sparePartId" id="sparePart_${index}" class="form-select form-select-sm ${selectedType === 'SPARE_PART' ? '' : 'd-none'}" onchange="onSelectItem(this, ${index})">
                        ${sparePartOptions}
                    </select>
                </div>
                <div class="col-md-2">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">SL</span>
                        <input type="number" name="items[${index}].quantity" min="1" value="${qty}" class="form-control form-control-sm text-center" oninput="calcRowTotal(${index})" id="qty_${index}">
                    </div>
                </div>
                <div class="col-md-2">
                    <input type="number" name="items[${index}].unitPrice" value="${unitPrice}" class="form-control form-control-sm text-end" placeholder="Đơn giá" oninput="calcRowTotal(${index})" id="price_${index}">
                </div>
                <div class="col-md-1 text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow('row_${index}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-end align-items-center gap-2 mt-1 pe-1">
                <small class="text-muted">Thành tiền:</small>
                <small class="fw-bold text-danger" id="rowTotal_${index}">${formatCurrency(total)}</small>
            </div>
        `;

        container.appendChild(row);
        calcTotal();
    }

    function toggleItemType(selectEl, index) {
        const type = selectEl.value;
        const srvSelect = document.getElementById(`service_${index}`);
        const partSelect = document.getElementById(`sparePart_${index}`);

        if (type === 'SERVICE') {
            srvSelect.classList.remove('d-none');
            partSelect.classList.add('d-none');
            partSelect.value = '';
        } else {
            partSelect.classList.remove('d-none');
            srvSelect.classList.add('d-none');
            srvSelect.value = '';
        }
    }

    function onSelectItem(selectEl, index) {
        const selected = selectEl.options[selectEl.selectedIndex];
        const price = selected.getAttribute('data-price') || 0;
        const priceInput = document.getElementById(`price_${index}`);
        if (priceInput) {
            priceInput.value = price;
            calcRowTotal(index);
        }
    }

    function calcRowTotal(index) {
        const qtyEl = document.getElementById(`qty_${index}`);
        const priceEl = document.getElementById(`price_${index}`);
        const rowTotalEl = document.getElementById(`rowTotal_${index}`);

        const qty = parseInt(qtyEl?.value) || 0;
        const price = parseFloat(priceEl?.value) || 0;
        const total = qty * price;

        if (rowTotalEl) {
            rowTotalEl.innerText = formatCurrency(total);
        }
        calcTotal();
    }

    function removeRow(rowId) {
        const row = document.getElementById(rowId);
        if (row) {
            row.remove();
            calcTotal();
        }
    }

    function calcTotal() {
        const container = document.getElementById('itemsContainer');
        let sum = 0;
        if (container) {
            const rows = container.getElementsByClassName('item-row');
            for (let i = 0; i < rows.length; i++) {
                const qtyInputs = rows[i].querySelectorAll('input[name$=".quantity"]');
                const priceInputs = rows[i].querySelectorAll('input[name$=".unitPrice"]');
                if (qtyInputs.length > 0 && priceInputs.length > 0) {
                    const q = parseInt(qtyInputs[0].value) || 0;
                    const p = parseFloat(priceInputs[0].value) || 0;
                    sum += (q * p);
                }
            }
        }
        const totalDisplay = document.getElementById('totalDisplay');
        if (totalDisplay) {
            totalDisplay.innerText = formatCurrency(sum);
        }
    }

    // Khởi tạo các item hiện có
    if (existingItems && existingItems.length > 0) {
        existingItems.forEach(item => addItemRow(item));
    } else {
        addItemRow();
    }
</script>
</body>
</html>
