<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Cứu Hộ Khẩn Cấp - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div class="container-fluid" style="max-width: 900px;">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">Chi Tiết Yêu Cầu Cứu Hộ #<span th:text="${rescue.id}"></span></h5>
                        <a th:href="@{/admin/rescue}" class="btn btn-sm btn-light fw-bold">&larr; Trở về</a>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="row mb-4 p-3 bg-light rounded-3">
                            <div class="col-md-6">
                                <p class="mb-2"><strong>Khách Hàng:</strong> <span th:text="${rescue.customerName}"></span></p>
                                <p class="mb-2"><strong>Số Điện Thoại:</strong> <span class="text-primary fw-bold" th:text="${rescue.customerPhone}"></span></p>
                                <p class="mb-2"><strong>Biển Số Xe:</strong> <span class="badge bg-secondary fs-6" th:text="${rescue.licensePlate}"></span></p>
                                <p class="mb-0"><strong>Dòng Xe:</strong> <span th:text="${rescue.vehicleModel}"></span></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-2"><strong>Vị Trí Hiện Tại:</strong> <span class="text-danger fw-bold" th:text="${rescue.location}"></span></p>
                                <p class="mb-2"><strong>Mô Tả Sự Cố:</strong> <span th:text="${rescue.description}"></span></p>
                                <p class="mb-0"><strong>Thời Gian Gửi Yêu Cầu:</strong> <span th:text="${#temporals.format(rescue.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></span></p>
                            </div>
                        </div>

                        <h5 class="fw-bold mb-3">Cập Nhật Trạng Thái Cứu Hộ</h5>
                        <form th:action="@{/admin/rescue/{id}/update(id=${rescue.id})}" method="post" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Trạng Thái</label>
                                <select name="status" class="form-select">
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == rescue.status}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">ID Kỹ Thuật Viên Phụ Trách</label>
                                <input type="number" name="technicianId" th:value="${rescue.technicianId}" class="form-control" placeholder="Nhập ID KTV">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Ghi Chú Tiến Độ</label>
                                <input type="text" name="note" th:value="${rescue.note}" class="form-control" placeholder="VD: Đang di chuyển...">
                            </div>
                            <div class="col-12 text-end mt-4">
                                <button type="submit" class="btn btn-danger fw-bold">Lưu Cập Nhật</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
