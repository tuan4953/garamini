<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Cứu Hộ Khẩn Cấp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Chi Tiết Yêu Cầu Cứu Hộ #<span th:text="${rescue.id}"></span></h4>
            <a th:href="@{/admin/rescue}" class="btn btn-sm btn-light">Trở về</a>
        </div>
        <div class="card-body">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <p><strong>Khách Hàng:</strong> <span th:text="${rescue.customerName}"></span></p>
                    <p><strong>Số Điện Thoại:</strong> <span class="text-primary fw-bold" th:text="${rescue.customerPhone}"></span></p>
                    <p><strong>Biển Số Xe:</strong> <span class="badge bg-secondary fs-6" th:text="${rescue.licensePlate}"></span></p>
                    <p><strong>Dòng Xe:</strong> <span th:text="${rescue.vehicleModel}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Vị Trí Hiện Tại:</strong> <span class="text-danger fw-bold" th:text="${rescue.location}"></span></p>
                    <p><strong>Mô Tả Sự Cố:</strong> <span th:text="${rescue.description}"></span></p>
                    <p><strong>Thời Gian Gửi Yêu Cầu:</strong> <span th:text="${#temporals.format(rescue.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></span></p>
                </div>
            </div>

            <hr>

            <h5 class="mb-3">Cập Nhật Trạng Thái Cứu Hộ</h5>
            <form th:action="@{/admin/rescue/{id}/update(id=${rescue.id})}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Trạng Thái</label>
                    <select name="status" class="form-select">
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == rescue.status}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ID Kỹ Thuật Viên Phụ Trách</label>
                    <input type="number" name="technicianId" th:value="${rescue.technicianId}" class="form-control" placeholder="Nhập ID kỹ thuật viên">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ghi Chú Tiến Độ</label>
                    <input type="text" name="note" th:value="${rescue.note}" class="form-control" placeholder="VD: Đang di chuyển đến hiện trường...">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-danger">Lưu Cập Nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
