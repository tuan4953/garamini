<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Dịch Vụ - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Quản Lý Danh Mục Dịch Vụ</h2>
            <a th:href="@{/admin/services/create}" class="btn btn-primary">+ Thêm Dịch Vụ Mới</a>
        </div>

        <div th:replace="~{fragments/alert :: alert}"></div>

        <!-- Tìm kiếm và Lọc -->
        <form th:action="@{/admin/services}" method="get" class="row g-3 mb-4">
            <div class="col-md-5">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên hoặc mô tả dịch vụ...">
            </div>
            <div class="col-md-3">
                <select name="active" class="form-select">
                    <option value="">-- Tất cả trạng thái --</option>
                    <option value="true" th:selected="${selectedActive == true}">Đang hoạt động</option>
                    <option value="false" th:selected="${selectedActive == false}">Ngừng hoạt động</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-secondary w-100">Lọc</button>
            </div>
        </form>

        <table class="table table-bordered table-hover shadow-sm align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên Dịch Vụ</th>
                <th>Đơn Giá</th>
                <th>Thời Gian (Phút)</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="srv : ${servicePage.content}">
                <td th:text="${srv.id}">1</td>
                <td>
                    <strong th:text="${srv.name}"></strong><br>
                    <small class="text-muted" th:text="${srv.description}"></small>
                </td>
                <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(srv.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td th:text="${srv.estimatedDurationMinutes != null ? srv.estimatedDurationMinutes : '-'}"></td>
                <td>
                    <span th:if="${srv.active}" class="badge bg-success">Hoạt động</span>
                    <span th:unless="${srv.active}" class="badge bg-secondary">Tạm ngưng</span>
                </td>
                <td>
                    <a th:href="@{/admin/services/edit/{id}(id=${srv.id})}" class="btn btn-sm btn-warning">Sửa</a>
                    <form th:action="@{/admin/services/{id}/toggle-status(id=${srv.id})}" method="post" class="d-inline">
                        <button type="submit"
                                th:class="${srv.active ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'}"
                                th:text="${srv.active ? 'Tắt' : 'Kích hoạt'}">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/pagination :: pagination}"></div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
