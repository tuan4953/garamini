<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thành Phần Dịch Vụ - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

    <div class="admin-main-container">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

        <main class="admin-content">
            <div class="container-fluid" style="max-width: 800px;">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white py-3">
                        <h5 class="mb-0 fw-bold" th:text="${serviceRequest.id == null ? 'Thêm Dịch Vụ Mới' : 'Cập Nhật Dịch Vụ'}"></h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${serviceRequest.id == null ? '/admin/services/create' : '/admin/services/edit/' + serviceRequest.id}"
                              th:object="${serviceRequest}" method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Tên Dịch Vụ (*):</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label fw-semibold">Đơn Giá (VNĐ) (*):</label>
                                    <input type="number" step="1000" class="form-control" id="price" th:field="*{price}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="estimatedDurationMinutes" class="form-label fw-semibold">Thời Gian Dự Kiến (Phút):</label>
                                    <input type="number" class="form-control" id="estimatedDurationMinutes" th:field="*{estimatedDurationMinutes}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold">Mô Tả Dịch Vụ:</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
                            </div>

                            <div class="form-check mb-4">
                                <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                                <label class="form-check-label" for="active">Cho phép hiển thị &amp; cung cấp dịch vụ này</label>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/services}" class="btn btn-secondary">Quay lại</a>
                                <button type="submit" class="btn btn-success fw-bold">Lưu Thông Tin</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: admin-footer}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
