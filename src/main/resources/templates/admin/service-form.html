<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thành Phần Dịch Vụ - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <div class="container-fluid p-4" style="max-width: 700px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0" th:text="${serviceRequest.id == null ? 'Thêm Dịch Vụ Mới' : 'Cập Nhật Dịch Vụ'}"></h4>
            </div>
            <div class="card-body">
                <form th:action="${serviceRequest.id == null ? '/admin/services/create' : '/admin/services/edit/' + serviceRequest.id}"
                      th:object="${serviceRequest}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="name" class="form-label">Tên Dịch Vụ (*):</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label">Đơn Giá (VNĐ) (*):</label>
                            <input type="number" step="1000" class="form-control" id="price" th:field="*{price}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="estimatedDurationMinutes" class="form-label">Thời Gian Dự Kiến (Phút):</label>
                            <input type="number" class="form-control" id="estimatedDurationMinutes" th:field="*{estimatedDurationMinutes}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Mô Tả Dịch Vụ:</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                        <label class="form-check-label" for="active">Cho phép hiển thị & cung cấp dịch vụ này</label>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/admin/services}" class="btn btn-secondary">Quay lại</a>
                        <button type="submit" class="btn btn-success">Lưu Thông Tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
