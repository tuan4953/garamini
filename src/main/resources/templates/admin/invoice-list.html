<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Hóa Đơn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Danh Sách Hóa Đơn</h2>
            <a th:href="@{/admin/invoices/create}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Tạo hóa đơn
            </a>
        </div>

        <div th:replace="~{fragments/alert :: alert}"></div>

        <!-- Bộ lọc Search & Status -->
        <form th:action="@{/admin/invoices}" method="get" class="row g-3 mb-4">
            <div class="col-md-4">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm theo mã, tên KH..." th:value="${keyword}">
            </div>
            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">-- Tất cả trạng thái --</option>
                    <option th:each="st : ${statuses}"
                            th:value="${st}"
                            th:text="${st}"
                            th:selected="${st == selectedStatus}">
                    </option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-secondary w-100">Lọc</button>
            </div>
        </form>

        <!-- Bảng danh sách hóa đơn -->
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Mã HĐ</th>
                <th>Khách Hàng</th>
                <th>Ngày Tạo</th>
                <th>Tổng Tiền</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="invoice : ${invoicePage.content}">
                <td th:text="${'#INV-' + invoice.id}">#INV-1</td>
                <td th:text="${invoice.customerName}">Nguyễn Văn A</td>
                <td th:text="${#temporals.format(invoice.issuedAt, 'dd/MM/yyyy HH:mm')}">29/08/2026</td>
                <td th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>
                <td>
                    <!-- Đã thống nhất toàn bộ về field paymentStatus và gắn Badge màu Bootstrap -->
                    <span class="badge bg-success"
                          th:if="${invoice.paymentStatus?.name() == 'PAID'}">Đã thanh toán</span>

                    <span class="badge bg-warning text-dark"
                          th:if="${invoice.paymentStatus?.name() == 'UNPAID'}">Chưa thanh toán</span>

                    <span class="badge bg-secondary"
                          th:if="${invoice.paymentStatus?.name() != 'PAID' && invoice.paymentStatus?.name() != 'UNPAID'}"
                          th:text="${invoice.paymentStatus}">Khác</span>
                </td>
                <td>
                    <a th:href="@{/admin/invoices/{id}(id=${invoice.id})}" class="btn btn-sm btn-info text-white">
                        <i class="bi bi-eye"></i> Xem
                    </a>
                </td>
            </tr>
            <tr th:if="${!invoicePage.hasContent()}">
                <td colspan="6" class="text-center text-muted">Không tìm thấy hóa đơn nào</td>
            </tr>
            </tbody>
        </table>

        <!-- Phân trang -->
        <nav th:if="${invoicePage.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${invoicePage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/invoices(page=${invoicePage.number - 1}, keyword=${keyword}, status=${selectedStatus})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, invoicePage.totalPages - 1)}"
                    th:classappend="${i == invoicePage.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/invoices(page=${i}, keyword=${keyword}, status=${selectedStatus})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${invoicePage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/invoices(page=${invoicePage.number + 1}, keyword=${keyword}, status=${selectedStatus})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
