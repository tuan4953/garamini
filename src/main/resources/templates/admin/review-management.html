<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đánh giá - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark"><i class="fas fa-star-half-alt text-warning me-2"></i>Quản lý Đánh giá & Phản hồi</h3>
    </div>

    <div th-if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th-text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>#ID</th>
                        <th>Khách hàng</th>
                        <th>Mã Đơn</th>
                        <th>Số sao</th>
                        <th style="width: 30%;">Đánh giá</th>
                        <th>Phản hồi Admin</th>
                        <th>Trạng thái</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th-each="review : ${reviewList}">
                        <td class="fw-bold" th-text="'#' + ${review.id}">#1</td>
                        <td th-text="${review.customerName}">Nguyễn Văn A</td>
                        <td th-text="'#' + ${review.invoiceId}">#102</td>
                        <td>
                                <span class="badge bg-warning text-dark">
                                    <span th-text="${review.rating}">5</span> <i class="fas fa-star"></i>
                                </span>
                        </td>
                        <td th-text="${review.comment}">Sửa xe nhanh, đúng giá.</td>
                        <td>
                            <span th-if="${review.adminReply != null}" class="text-success small fw-semibold" th-text="${review.adminReply}">Đã phản hồi...</span>
                            <span th-if="${review.adminReply == null}" class="text-muted small"><em>Chưa phản hồi</em></span>
                        </td>
                        <td>
                            <span th-if="${review.visible}" class="badge bg-success">Hiển thị</span>
                            <span th-if="${!review.visible}" class="badge bg-danger">Đang ẩn</span>
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                    data-bs-toggle="modal"
                                    th-data-bs-target="'#replyModal-' + ${review.id}">
                                <i class="fas fa-reply"></i>
                            </button>

                            <form th-action="@{'/admin/reviews/toggle-status/' + ${review.id}}" method="POST" class="d-inline">
                                <button type="submit"
                                        th-class="${review.visible ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success'}"
                                        th-title="${review.visible ? 'Ẩn đánh giá này' : 'Hiện đánh giá này'}">
                                    <i th-class="${review.visible ? 'fas fa-eye-slash' : 'fas fa-eye'}"></i>
                                </button>
                            </form>
                        </td>

                        <!-- MODAL PHẢN HỒI -->
                        <div class="modal fade" th-id="'replyModal-' + ${review.id}" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <form th-action="@{'/admin/reviews/reply/' + ${review.id}}" method="POST">
                                        <div class="modal-header bg-primary text-white">
                                            <h5 class="modal-title">Phản hồi Đánh giá #<span th-text="${review.id}"></span></h5>
                                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <p><strong>Khách hàng:</strong> <span th-text="${review.customerName}"></span></p>
                                            <p><strong>Nội dung:</strong> "<span th-text="${review.comment}"></span>"</p>
                                            <hr>
                                            <div class="mb-3">
                                                <label class="form-label fw-bold">Nội dung phản hồi:</label>
                                                <textarea name="adminReply" class="form-control" rows="3"
                                                          th-text="${review.adminReply}" placeholder="Nhập câu trả lời của cửa hàng..." required></textarea>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                            <button type="submit" class="btn btn-primary">Lưu phản hồi</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <!-- END MODAL -->
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
