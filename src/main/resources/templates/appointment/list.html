<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch Hẹn Của Tôi - Motorbike Garage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Lịch Hẹn Của Tôi</h2>
        <a th:href="@{/customer/appointments/create}" class="btn btn-primary">+ Đặt Lịch Mới</a>
    </div>

    <div th:replace="~{fragments/alert :: alert}"></div>

    <div class="table-responsive shadow-sm rounded" th:if="${not #lists.isEmpty(appointments)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Mã Lịch</th>
                <th>Phương Tiện</th>
                <th>Thời Gian Hẹn</th>
                <th>Ghi Chú</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="app : ${appointments}">
                <td th:text="'#APT-' + ${app.id}" class="fw-bold">#APT-1</td>
                <td>
                    <strong th:text="${app.licensePlate}">29A1-12345</strong><br>
                    <small class="text-muted" th:text="${app.vehicleBrand + ' ' + app.vehicleModel}">Honda SH</small>
                </td>
                <td th:text="${#temporals.format(app.appointmentDate, 'dd/MM/yyyy HH:mm')}">20/08/2026 14:00</td>
                <td th:text="${app.notes != null && !app.notes.empty ? app.notes : 'Không có'}">Nội dung</td>
                <td>
                    <span th:if="${app.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Chờ Xác Nhận</span>
                    <span th:if="${app.status.name() == 'CONFIRMED'}" class="badge bg-info">Đã Xác Nhận</span>
                    <span th:if="${app.status.name() == 'IN_PROGRESS'}" class="badge bg-primary">Đang Sửa Chữa</span>
                    <span th:if="${app.status.name() == 'COMPLETED'}" class="badge bg-success">Hoàn Thành</span>
                    <span th:if="${app.status.name() == 'CANCELLED'}" class="badge bg-danger">Đã Hủy</span>
                </td>
                <td>
                    <button th:if="${app.status.name() == 'PENDING' || app.status.name() == 'CONFIRMED'}"
                            class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#cancelModal-' + ${app.id}">
                        Hủy Lịch
                    </button>

                    <!-- Modal Hủy Lịch -->
                    <div class="modal fade" th:id="'cancelModal-' + ${app.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form th:action="@{/customer/appointments/{id}/cancel(id=${app.id})}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Xác Nhận Hủy Lịch Hẹn #APT-[[${app.id}]]</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label">Lý do hủy (*):</label>
                                            <textarea name="reason" class="form-control" rows="3" required placeholder="Nhập lý do bạn muốn hủy lịch..."></textarea>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                        <button type="submit" class="btn btn-danger">Hủy Lịch Hẹn</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info text-center">
        Bạn chưa có lịch hẹn bảo dưỡng nào. <a th:href="@{/customer/appointments/create}">Đặt lịch ngay</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
