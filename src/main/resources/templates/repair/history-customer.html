<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Sửa Chữa & Nâng Cấp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0">
            <i class="fa-solid fa-wrench text-warning me-2"></i> LỊCH SỬ SỬA CHỮA & NÂNG CẤP
        </h3>
        <a href="/tuning/booking" class="btn btn-warning fw-bold">
            <i class="fa-solid fa-plus me-1"></i> Đặt Lịch Mới
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="py-3 ps-3">Mã Phiếu</th>
                        <th scope="col" class="py-3">Thông Tin Xe</th>
                        <th scope="col" class="py-3">Loại Dịch Vụ</th>
                        <th scope="col" class="py-3">Thời Gian</th>
                        <th scope="col" class="py-3">Chi Phi (VNĐ)</th>
                        <th scope="col" class="py-3">Trạng Thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Trường hợp chưa có lịch sử -->
                    <tr th:if="${#lists.isEmpty(repairHistory)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-folder-open fa-2x mb-2 d-block"></i>
                            Bạn chưa có lịch sử sửa chữa hoặc nâng cấp xe nào.
                        </td>
                    </tr>

                    <!-- Hiển thị danh sách lịch sử -->
                    <tr th:each="item : ${repairHistory}">
                        <td class="ps-3 fw-bold text-primary" th:text="${item.repairCode}">REP-001</td>
                        <td th:text="${item.vehicleInfo}">Honda SH - 29A1-123.45</td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${item.serviceType}">TUNING</span>
                        </td>
                        <td th:text="${#temporals.format(item.serviceDate, 'dd/MM/yyyy HH:mm')}">27/08/2026 14:30</td>
                        <td class="fw-bold text-danger" th:text="${item.totalAmount != null ? #numbers.formatDecimal(item.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Chưa báo giá'}">0 đ</td>
                        <td>
                            <span th:if="${item.status == 'COMPLETED'}" class="badge bg-success">Hoàn thành</span>
                            <span th:if="${item.status == 'PENDING'}" class="badge bg-warning text-dark">Chờ xử lý</span>
                            <span th:if="${item.status == 'CANCELLED'}" class="badge bg-danger">Đã hủy</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
