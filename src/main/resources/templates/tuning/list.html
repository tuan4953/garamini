<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm & Dịch Vụ Độ Xe - Garage Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-5">
    <h2 class="text-center mb-4 text-primary fw-bold">SẢN PHẨM & DỊCH VỤ ĐỘ XE</h2>

    <div class="row">
        <!-- Đã sửa tên biến từ tunings thành tuningServices -->
        <div class="col-md-4 mb-4" th:each="item : ${tuningServices}">
            <div class="card h-100 shadow-sm border-0">
                <!-- Hiển thị ảnh sản phẩm nếu có -->
                <img th:if="${item?.imageUrl != null && !item.imageUrl.isBlank()}"
                     th:src="${item.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Tuning Image">

                <div class="card-body">
                    <span class="badge bg-warning text-dark mb-2" th:text="${item?.categoryName != null ? item.categoryName : 'Khác'}">Danh mục</span>
                    <h5 class="card-title text-dark fw-bold" th:text="${item?.name}">Tên sản phẩm</h5>
                    <p class="card-text text-muted text-truncate" th:text="${item?.description}">Mô tả ngắn...</p>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fw-bold text-danger fs-5">
                            <span th:text="${item?.price != null ? #numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT') : '0'}">0</span> VNĐ
                        </span>

                        <span class="badge bg-success" th:if="${item?.stockQuantity == null || item.stockQuantity > 0}">
                            Còn hàng (<span th:text="${item?.stockQuantity != null ? item.stockQuantity : 'N/A'}">10</span>)
                        </span>
                        <span class="badge bg-danger" th:if="${item?.stockQuantity != null && item.stockQuantity <= 0}">Hết hàng</span>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 pb-3">
                    <!-- Sửa đường dẫn xem chi tiết khớp với Controller: /tuning/products/{id} -->
                    <a th:href="@{/tuning/products/{id}(id=${item.id})}" class="btn btn-outline-primary w-100">
                        <i class="fa-solid fa-eye me-1"></i> Xem chi tiết
                    </a>
                </div>
            </div>
        </div>

        <!-- Đã sửa kiểm tra rỗng cho biến tuningServices -->
        <div th:if="${#lists.isEmpty(tuningServices)}" class="col-12 text-center py-5">
            <p class="text-muted fs-5">Hiện chưa có sản phẩm độ xe nào được đăng tải.</p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
