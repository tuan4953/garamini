<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/tride-layout.css}">
</head>
<body>
<!-- Fragment Header dùng chung -->
<header th:fragment="header" class="sticky-top bg-dark navbar-dark shadow-sm">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <!-- Logo Garage -->
            <a class="navbar-brand fw-bold text-warning fs-4" th:href="@{/}">
                <i class="fa-solid fa-wrench me-2"></i>GARAGE AUTO
            </a>

            <!-- Nút toggle cho giao diện mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Danh sách Menu liên kết -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/rescue}">Cứu hộ 24/7</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/do-xe}">Độ xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/nang-cap}">Nâng cấp xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/phu-tung}">Phụ tùng</a>
                    </li>
                </ul>

                <!-- Menu góc phải (Khách hàng & Đăng nhập/Đăng xuất) -->
                <ul class="navbar-nav align-items-center">
                    <!-- Trường hợp Đã Đăng Nhập -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle btn btn-outline-light text-white border-0 px-3"
                           href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-circle-user me-1 text-warning"></i>
                            <span sec:authentication="name">Tài khoản</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/customer/profile}">
                                    <i class="fa-solid fa-id-card me-2 text-primary"></i>Hồ sơ cá nhân
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/customer/vehicles}">
                                    <i class="fa-solid fa-car me-2 text-info"></i>Xe của tôi
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/customer/appointments}">
                                    <i class="fa-solid fa-calendar-check me-2 text-success"></i>Lịch hẹn bảo dưỡng
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/customer/invoices}">
                                    <i class="fa-solid fa-file-invoice-dollar me-2 text-warning"></i>Hóa đơn thanh toán
                                </a>
                            </li>

                            <!-- Link dành riêng cho Admin nếu user có quyền -->
                            <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
                                <hr class="dropdown-divider">
                                <a class="dropdown-item text-danger fw-bold" th:href="@{/admin/dashboard}">
                                    <i class="fa-solid fa-user-shield me-2"></i>Trang Quản Trị
                                </a>
                            </li>

                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>

                    <!-- Trường hợp Chưa Đăng Nhập -->
                    <li class="nav-item d-flex gap-2" sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn btn-outline-warning btn-sm fw-bold">Đăng nhập</a>
                        <a th:href="@{/register}" class="btn btn-warning btn-sm fw-bold">Đăng ký</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
