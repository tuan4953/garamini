<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Báo Giá</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container my-5">
    <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="text-primary mb-0">Phiếu Báo Giá: <span th:text="${quotation.quotationCode}"></span></h3>
            <a th:href="@{/admin/quotations}" class="btn btn-outline-secondary">Trở về</a>
        </div>
        <hr>
        <div class="row mb-4">
            <div class="col-md-6">
                <p><strong>Biển Số Xe:</strong> <span class="badge bg-secondary fs-6" th:text="${quotation.licensePlate}"></span></p>
                <p><strong>Dòng Xe:</strong> <span th:text="${quotation.vehicleModel}"></span></p>
                <p><strong>Khách Hàng:</strong> <span th:text="${quotation.customerName}"></span> (<span th:text="${quotation.customerPhone}"></span>)</p>
            </div>
            <div class="col-md-6">
                <p><strong>Trạng Thái:</strong> <span class="badge bg-info text-dark fs-6" th:text="${quotation.status}"></span></p>
                <p><strong>Ngày Tạo:</strong> <span th:text="${#temporals.format(quotation.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>

                <!-- Form Đổi Trạng Thái -->
                <form th:action="@{/admin/quotations/{id}/status(id=${quotation.id})}" method="post" class="d-flex gap-2 mt-2">
                    <select name="status" class="form-select form-select-sm w-auto">
                        <option value="ACCEPTED">ACCEPTED (Đồng ý)</option>
                        <option value="REJECTED">REJECTED (Từ chối)</option>
                        <option value="EXPIRED">EXPIRED (Hết hạn)</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-dark">Cập nhật</button>
                </form>
            </div>
        </div>

        <h5>Chi Tiết Báo Giá Hạng Mục</h5>
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>Tên Hạng Mục</th>
                <th>Loại</th>
                <th class="text-center">Số Lượng</th>
                <th class="text-end">Đơn Giá</th>
                <th class="text-end">Thành Tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${quotation.items}">
                <td th:text="${item.itemName}"></td>
                <td><span class="badge bg-light text-dark border" th:text="${item.type}"></span></td>
                <td class="text-center" th:text="${item.quantity}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(quotation.items)}">
                <td colspan="5" class="text-center text-muted">Chưa có item nào trong báo giá</td>
            </tr>
            </tbody>
        </table>

        <div class="text-end me-2 mt-3">
            <h4>Tổng Cộng Dự Kiến: <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(quotation.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h4>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
