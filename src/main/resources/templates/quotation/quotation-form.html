<!--/*@thymesVar id="quotationRequest" type="com.garage.quotation.dto.QuotationRequest"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Bản Báo Giá</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Tạo Bản Báo Giá Mới</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/quotations/create}" th:object="${quotationRequest}" method="post">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">ID Xe <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{vehicleId}" class="form-control" required placeholder="Nhập ID phương tiện">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ID Khách Hàng <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{customerId}" class="form-control" required placeholder="Nhập ID khách hàng">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Ghi Chú</label>
                        <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Ghi chú điều khoản báo giá..."></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/quotations}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary">Lưu Báo Giá</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
