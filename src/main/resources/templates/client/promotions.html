<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chương Trình Ưu Đãi - Gara Motorbike</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .coupon-card {
            border: 2px dashed #0d6efd;
            background: #f8f9fa;
        }
        .coupon-code {
            letter-spacing: 2px;
            font-size: 1.25rem;
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>
<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-primary"><i class="fas fa-tags me-2"></i>MÃ GIẢM GIÁ & ƯU ĐÃI HIỆN CÓ</h2>
        <p class="text-muted">Lưu mã ưu đãi để áp dụng cho đợt bảo dưỡng và sửa chữa xe máy tiếp theo</p>
    </div>

    <div class="row g-4">
        <div th:each="promo : ${promotions}" class="col-md-6 col-lg-4">
            <div class="card coupon-card shadow-sm h-100 p-3">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-danger fs-6" th:if="${promo.discountPercent != null}" th:text="'Giảm ' + ${promo.discountPercent} + '%'"></span>
                            <span class="badge bg-success fs-6" th:if="${promo.discountAmount != null}" th:text="'Giảm ' + ${#numbers.formatDecimal(promo.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                            <small class="text-muted"><i class="far fa-clock me-1"></i>Hạn: <span th:text="${#temporals.format(promo.endDate, 'dd/MM/yyyy')}"></span></small>
                        </div>
                        <h5 class="card-title fw-bold text-dark" th:text="${promo.title}">Tiêu đề</h5>
                        <p class="card-text text-secondary small" th:text="${promo.description}">Mô tả chi tiết chương trình...</p>
                    </div>

                    <div class="bg-white p-2 text-center rounded border mt-3">
                        <span class="fw-bold text-primary coupon-code" th:text="${promo.code}">CODE123</span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(promotions)}" class="col-12 text-center py-5 text-muted">
            <i class="fas fa-ticket-alt fa-3x mb-3"></i>
            <p>Hiện chưa có chương trình ưu đãi nào đang diễn ra.</p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
