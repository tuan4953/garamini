<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th-text="${news.title}">Chi tiết bài viết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <a th:href="@{/news}" class="btn btn-link text-decoration-none mb-3 p-0">
                <i class="fas fa-arrow-left me-1"></i> Quay lại danh sách tin tức
            </a>

            <article class="card shadow-sm border-0 p-4">
                <h1 class="fw-bold mb-3" th:text="${news.title}">Tiêu đề bài viết</h1>

                <div class="text-muted small mb-4">
                    <i class="far fa-clock me-1"></i>
                    Đăng ngày: <span th:text="${#temporals.format(news.createdAt, 'dd/MM/yyyy HH:mm')}">25/08/2026</span>
                </div>

                <div th-if="${news.imageUrl != null && !news.imageUrl.isEmpty()}" class="mb-4">
                    <img th:src="${news.imageUrl}" class="img-fluid rounded w-100" style="max-height: 400px; object-fit: cover;" alt="Feature Image">
                </div>

                <div class="p-3 bg-light border-start border-primary border-4 mb-4" th-if="${news.summary != null && !news.summary.isEmpty()}">
                    <p class="lead mb-0 fst-italic text-secondary" th:text="${news.summary}">Tóm tắt nội dung bài viết...</p>
                </div>

                <!-- Hiển thị nội dung dạng HTML -->
                <div class="news-content fs-5 text-dark" th:utext="${news.content}">
                    Nội dung chi tiết bài viết...
                </div>
            </article>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
