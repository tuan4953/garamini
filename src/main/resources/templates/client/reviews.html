<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đánh giá dịch vụ - Gara Motorbike</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .star-rating {
            direction: rtl;
            display: inline-block;
        }
        .star-rating input[type="radio"] {
            display: none;
        }
        .star-rating label {
            color: #bbb;
            font-size: 2rem;
            padding: 0 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input[type="radio"]:checked ~ label {
            color: #f39c12;
        }
        .text-warning { color: #f39c12 !important; }
        .admin-reply {
            background-color: #f8f9fa;
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container py-5">
    <h2 class="mb-4 text-center text-primary fw-bold">ĐÁNH GIÁ DỊCH VỤ SỬA CHỮA</h2>

    <div class="row g-4">
        <!-- FORM GỬI ĐÁNH GIÁ -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0"><i class="fas fa-pen me-2"></i>Gửi phản hồi của bạn</h5>
                </div>
                <div class="card-body">
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Tên th:object phải khớp chính xác với name addAttribute ở Controller -->
                    <form th:action="@{/reviews}" th:object="${reviewRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên:</label>
                            <input type="text" class="form-control" th:field="*{customerName}" placeholder="Nhập tên người đánh giá" required />
                            <div class="text-danger small" th:if="${#fields.hasErrors('customerName')}" th-errors="*{customerName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã Hóa Đơn / Phiếu Sửa Chữa:</label>
                            <input type="number" class="form-control" th:field="*{invoiceId}" placeholder="VD: 101" required />
                            <div class="text-danger small" th:if="${#fields.hasErrors('invoiceId')}" th-errors="*{invoiceId}"></div>
                        </div>

                        <div class="mb-3 text-center">
                            <label class="form-label d-block fw-bold">Mức độ hài lòng:</label>
                            <div class="star-rating">
                                <input type="radio" id="star5" th:field="*{rating}" value="5"/><label for="star5" title="5 sao"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star4" th:field="*{rating}" value="4"/><label for="star4" title="4 sao"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star3" th:field="*{rating}" value="3"/><label for="star3" title="3 sao"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star2" th:field="*{rating}" value="2"/><label for="star2" title="2 sao"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star1" th:field="*{rating}" value="1"/><label for="star1" title="1 sao"><i class="fas fa-star"></i></label>
                            </div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('rating')}" th-errors="*{rating}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary">Gửi đánh giá</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- DANH SÁCH REVIEW -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0 text-secondary"><i class="fas fa-comments me-2"></i>Đánh giá từ khách hàng</h5>
                    <span class="badge bg-warning text-dark fs-6" th:text="'Trung bình: ' + ${#numbers.formatDecimal(avgRating, 1, 1)} + ' ★'">4.5 ★</span>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <div th:each="review : ${reviews}" class="list-group-item p-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h6 class="mb-0 fw-bold" th:text="${review.customerName}">Nguyễn Văn A</h6>
                                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}">25/08/2026</small>
                            </div>
                            <div class="text-warning mb-2">
                                <i th:each="i : ${#numbers.sequence(1, 5)}"
                                   th:class="${i <= review.rating ? 'fas fa-star' : 'far fa-star'}"></i>
                            </div>
                            <p class="mb-2 text-dark" th:text="${review.comment}">Dịch vụ rất tốt!</p>

                            <div th:if="${review.adminReply != null}" class="admin-reply p-2 mt-2 rounded">
                                <small class="fw-bold text-primary"><i class="fas fa-reply me-1"></i>Phản hồi từ Cửa hàng:</small>
                                <p class="mb-0 small text-secondary" th:text="${review.adminReply}">Cảm ơn quý khách!</p>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(reviews)}" class="p-4 text-center text-muted">
                            Chưa có đánh giá nào. Hãy là người đầu tiên đánh giá!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
