<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tin Tức & Kinh Nghiệm Xe - Gara Motorbike</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header}"></div>

<!-- 2. NHÚNG FILE NAVBAR (Thường chứa menu điều hướng chính) -->
<div th:replace="~{fragments/navbar}"></div>

<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-primary">TIN TỨC & MẸO BẢO BƯỠNG XE</h2>
        <p class="text-muted">Cập nhật tin tức mới nhất và các kinh nghiệm chăm sóc xe máy hữu ích</p>
    </div>

    <div class="row g-4">
        <div th:each="news : ${newsList}" class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
                <img th:src="${news.imageUrl != null && !news.imageUrl.isEmpty() ? news.imageUrl : 'https://via.placeholder.com/400x220?text=Gara+Motorbike'}"
                     class="card-img-top" alt="Thumbnail" style="height: 200px; object-fit: cover;">

                <div class="card-body d-flex flex-column">
                    <small class="text-muted mb-2">
                        <i class="far fa-calendar-alt me-1"></i>
                        <span th:text="${#temporals.format(news.createdAt, 'dd/MM/yyyy')}">25/08/2026</span>
                    </small>
                    <h5 class="card-title fw-bold text-dark" th:text="${news.title}">Tiêu đề tin tức</h5>
                    <p class="card-text text-secondary flex-grow-1" th:text="${#strings.abbreviate(news.summary, 120)}">Mô tả ngắn...</p>

                    <a th:href="@{'/news/' + ${news.id}}" class="btn btn-outline-primary mt-3">
                        Đọc tiếp <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(newsList)}" class="col-12 text-center py-5 text-muted">
            <i class="fas fa-newspaper fa-3x mb-3"></i>
            <p>Hiện chưa có bài viết nào được đăng.</p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
