spring.application.name=motorbike
# ========================================
# SERVER
# ========================================

server.port=8080


# ========================================
# MYSQL DATABASE
# ========================================

spring.datasource.url=jdbc:mysql://localhost:3306/gara_mini?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=tuan2006@

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ========================================
# JPA / HIBERNATE
# ========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true
# ========================================
# THYMELEAF
# ========================================

spring.thymeleaf.cache=false


# ========================================
# FILE UPLOAD
# ========================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# ========================================
# ACTUATOR
# ========================================

management.endpoints.web.exposure.include=health,info
# ========================================
# DEBUG LOGGING & ERROR DETAILS
# ========================================
